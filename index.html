<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Muhammad Dion Rizqie 🎉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.min.js"></script>
    <script src="https://react.dev/cdn/react/18/umd/react.production.min.js"></script>
    <script src="https://react.dev/cdn/react-dom/18/umd/react-dom.production.min.js"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        function BirthdayGreeting() {
            const [opened, setOpened] = React.useState(false);

            React.useEffect(() => {
                const audio = new Audio('./birthday-song.mp3');
                audio.autoplay = true;
                audio.loop = true;
                audio.volume = 0.5;
                audio.play().catch(error => console.log("Autoplay prevented:", error));

                return () => {
                    audio.pause();
                    audio.currentTime = 0;
                };
            }, []);

            return React.createElement(
                'div',
                { className: 'min-h-screen bg-gradient-to-br from-black via-zinc-900 to-zinc-800 flex items-center justify-center p-6 overflow-hidden text-white relative' },
                React.createElement(
                    'div',
                    { className: 'absolute inset-0 opacity-20' },
                    React.createElement('div', { className: 'absolute top-10 left-10 text-4xl animate-bounce' }, '✨'),
                    React.createElement('div', { className: 'absolute top-24 right-16 text-3xl animate-pulse' }, '🎈'),
                    React.createElement('div', { className: 'absolute bottom-16 left-20 text-4xl animate-pulse' }, '🎂'),
                    React.createElement('div', { className: 'absolute bottom-20 right-10 text-3xl animate-bounce' }, '🤍')
                ),
                !opened ? 
                React.createElement(
                    'div',
                    { className: 'max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl p-10 shadow-2xl text-center' },
                    React.createElement(
                        'div',
                        { className: 'mb-6 flex justify-center' },
                        React.createElement('img', {
                            src: './dion-rizqie.jpg',
                            alt: 'Muhammad Dion Rizqie',
                            className: 'w-32 h-32 rounded-full border-4 border-white/20 shadow-lg object-cover'
                        })
                    ),
                    React.createElement('h1', { className: 'text-4xl font-bold mb-2 leading-tight' }, 'Muhammad Dion Rizqie 🎁'),
                    React.createElement('p', { className: 'text-zinc-300 leading-8 mb-8' }, 'Ada sesuatu buat kamu ✨'),
                    React.createElement('p', { className: 'text-zinc-300 leading-8 mb-8' }, 'Klik tombol di bawah ini ✨'),
                    React.createElement(
                        'button',
                        {
                            onClick: () => setOpened(true),
                            className: 'px-8 py-4 rounded-2xl bg-white text-black font-semibold hover:scale-105 transition-all duration-300'
                        },
                        'Open Message 🤍'
                    )
                ) :
                React.createElement(
                    'div',
                    { className: 'max-w-xl w-full bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl p-10 shadow-2xl text-center' },
                    React.createElement(
                        'div',
                        { className: 'mb-6 flex justify-center' },
                        React.createElement('img', {
                            src: './dion-rizqie.jpg',
                            alt: 'Muhammad Dion Rizqie',
                            className: 'w-40 h-40 rounded-full border-4 border-white/20 shadow-lg object-cover'
                        })
                    ),
                    React.createElement('p', { className: 'text-zinc-300 text-sm tracking-[0.3em] mb-4' }, 'HAPPY 17TH BIRTHDAY'),
                    React.createElement('h1', { className: 'text-3xl md:text-4xl font-bold mb-2 leading-tight' }, 'Muhammad Dion Rizqie 🎉'),
                    React.createElement('h2', { className: 'text-3xl md:text-4xl font-bold mb-8 leading-tight' }, 'عيد ميلاد سعيد 🤍'),
                    React.createElement(
                        'div',
                        { className: 'space-y-4 text-lg leading-9 text-zinc-100' },
                        React.createElement('p', null, 'بارك الله في عمرك،'),
                        React.createElement('p', null, 'وأسعد الله قلبك،'),
                        React.createElement('p', null, 'وحقّق الله أحلامك،'),
                        React.createElement('p', null, 'وجعل أيّامك كلّها فرحًا وراحةً.')
                    ),
                    React.createElement(
                        'div',
                        { className: 'mt-10 text-zinc-300 leading-8 text-base' },
                        React.createElement('p', null, 'Semoga selalu dikelilingi hal-hal baik,'),
                        React.createElement('p', null, 'dan semoga semua yang disemogakan'),
                        React.createElement('p', null, 'pelan-pelan jadi kenyataan ✨')
                    ),
                    React.createElement(
                        'div',
                        { className: 'mt-10 flex items-center justify-center gap-3 text-3xl animate-pulse' },
                        React.createElement('span', null, '🎂'),
                        React.createElement('span', null, '✨'),
                        React.createElement('span', null, '🤍'),
                        React.createElement('span', null, '🎉')
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(BirthdayGreeting));
    </script>
</body>
</html>
